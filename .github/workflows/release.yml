name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.21'
          cache-dependency-path: helper/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag version and run regressions
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/ProxyCat/ProxyCat/Info.plist)"
          [[ "$VERSION" == "$APP_VERSION" ]]
          (cd helper && go test ./...)
          bash scripts/test-shutdown.sh
          bash scripts/test-campus-network.sh
          bash scripts/test-connection-recovery.sh
          bash scripts/package-unsigned_test.sh
          python3 scripts/test-update-manifest.py

      - name: Build release packages
        run: |
          bash scripts/package-unsigned.sh
          VERSION="${RELEASE_TAG#v}"
          bash scripts/test-dmg.sh "dist/ProxyCat-$VERSION.dmg"
          (cd helper && PROXYCAT_TEST_DMG="$GITHUB_WORKSPACE/dist/ProxyCat-$VERSION.dmg" go test ./internal/selfupdate -run '^TestInstallRealDMG$' -count=1)

      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Keep legacy updater assets so users can skip releases safely.
          ASSETS=("dist/ProxyCat-$VERSION.dmg" "dist/ProxyCat-$VERSION.dmg.sha256" "dist/ProxyCat-$VERSION-installer.zip" "dist/ProxyCat-$VERSION-installer.zip.sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          下载 DMG，打开后将 ProxyCat 拖到“应用程序”，再从“应用程序”启动。替换前请先退出旧版。

          已安装的用户可在 ProxyCat 中选择“检查更新”，安装完成后按提示重启应用。更新器优先使用 DMG，并在安装前验证校验值和应用签名。

          当前应用尚未进行 Apple Developer ID 签名和公证，首次打开如被系统拦截，请到“系统设置 → 隐私与安全性”中允许打开。

          附带的 ZIP 用于兼容旧版更新器。新安装请下载 DMG，已安装用户可以直接在应用内检查更新。
          NOTES
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          fi
          # Serve checks through a normal release asset, without anonymous API
          # rate limits. Publish it atomically with the verified installers.
          python3 scripts/generate-update-manifest.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-notes.md" dist
          ASSETS+=("dist/update.json")
          # Draft releases are listed by the API but are not returned by the
          # release-by-tag endpoint. Use their ID throughout, including retries.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          if [[ -z "$RELEASE_ID" ]]; then
            python3 - "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/release-create.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          print(json.dumps({'tag_name': sys.argv[1], 'name': 'ProxyCat ' + sys.argv[1], 'body': Path(sys.argv[2]).read_text(), 'target_commitish': sys.argv[3], 'draft': True, 'prerelease': False}))
          PY
            RELEASE_ID="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/release-create.json" --jq .id)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-state.json"
          python3 - "$RUNNER_TEMP/release-state.json" "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys
          release = json.loads(Path(sys.argv[1]).read_text())
          assert release['draft'] and release['tag_name'] == sys.argv[2], 'Refusing to overwrite a published release'
          PY
          for ASSET in "${ASSETS[@]}"; do
            NAME="$(basename "$ASSET")"
            EXISTING_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$NAME\") | .id")"
            if [[ -n "$EXISTING_ID" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$EXISTING_ID"
            fi
            curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 180 \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/octet-stream' \
              --data-binary "@$ASSET" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" > "$RUNNER_TEMP/upload-result.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-assets.json"
          python3 - "$RUNNER_TEMP/release-assets.json" "${ASSETS[@]}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          remote = {asset['name']: asset for asset in json.loads(Path(sys.argv[1]).read_text())['assets']}
          for name in sys.argv[2:]:
              path = Path(name)
              asset = remote[path.name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url
