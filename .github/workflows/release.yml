name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.21'
          cache-dependency-path: helper/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag version and run regressions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/ProxyCat/ProxyCat/Info.plist)"
          [[ "$VERSION" == "$APP_VERSION" ]]
          (cd helper && go test ./...)
          bash scripts/test-shutdown.sh
          bash scripts/test-campus-network.sh
          bash scripts/test-connection-recovery.sh
          bash scripts/package-unsigned_test.sh

      - name: Build release packages
        run: |
          if [[ "$GITHUB_REF_NAME" == v0.12.1 ]]; then
            # One transition release for updaters that only understand ZIPs.
            bash scripts/package-unsigned.sh
          else
            bash scripts/build-app.sh
            bash scripts/package-dmg.sh
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/test-dmg.sh "dist/ProxyCat-$VERSION.dmg"
          (cd helper && PROXYCAT_TEST_DMG="$GITHUB_WORKSPACE/dist/ProxyCat-$VERSION.dmg" go test ./internal/selfupdate -run '^TestInstallRealDMG$' -count=1)

      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=("dist/ProxyCat-$VERSION.dmg" "dist/ProxyCat-$VERSION.dmg.sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          下载 DMG，打开后将 ProxyCat 拖到“应用程序”，再从“应用程序”启动。替换前请先退出旧版。

          已安装的用户可在 ProxyCat 中选择“检查更新”，安装完成后按提示重启应用。更新器优先使用 DMG，并在安装前验证校验值和应用签名。

          当前应用尚未进行 Apple Developer ID 签名和公证，首次打开如被系统拦截，请到“系统设置 → 隐私与安全性”中允许打开。
          NOTES
          if [[ "$GITHUB_REF_NAME" == v0.12.1 ]]; then
            ASSETS+=("dist/ProxyCat-$VERSION-installer.zip" "dist/ProxyCat-$VERSION-installer.zip.sha256")
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          此版本新增中文 DMG 拖拽安装、应用内 DMG 更新，以及后续版本的 DMG 自动发布。附带的 ZIP 用于兼容旧版更新器；后续版本默认发布 DMG 和校验文件。
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --draft --title "ProxyCat $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 - "$RUNNER_TEMP/release-assets.json" "${ASSETS[@]}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          remote = {asset['name']: asset for asset in json.loads(Path(sys.argv[1]).read_text())['assets']}
          for name in sys.argv[2:]:
              path = Path(name)
              asset = remote[path.name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
