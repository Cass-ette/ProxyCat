name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-helper:
    name: Build Go Helper
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.21'

      - name: Build proxyctl
        working-directory: helper
        run: |
          go build -o proxyctl ./cmd/proxyctl

      - name: Run Go tests
        working-directory: helper
        run: |
          go test ./... -v

  build-app:
    name: Build Swift App
    runs-on: macos-latest
    needs: build-helper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version policy
        run: |
          python3 scripts/version.py check
          python3 scripts/test-version.py

      - name: Build proxyctl universal binary
        run: |
          cd helper
          GOOS=darwin GOARCH=amd64 go build -o ../app/ProxyCat/ProxyCat/Resources/proxyctl-amd64 ./cmd/proxyctl
          GOOS=darwin GOARCH=arm64 go build -o ../app/ProxyCat/ProxyCat/Resources/proxyctl-arm64 ./cmd/proxyctl
          cd ../app/ProxyCat/ProxyCat/Resources
          lipo -create proxyctl-amd64 proxyctl-arm64 -output proxyctl
          rm proxyctl-amd64 proxyctl-arm64
          chmod +x proxyctl

      - name: Build Xcode project
        run: |
          cd app/ProxyCat
          xcodebuild \
            -project ProxyCat.xcodeproj \
            -scheme ProxyCat \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test shutdown cleanup
        run: bash scripts/test-shutdown.sh

      - name: Test campus network protection
        run: bash scripts/test-campus-network.sh

      - name: Test connection recovery
        run: bash scripts/test-connection-recovery.sh

      - name: Verify app bundle
        run: |
          ls -la app/ProxyCat/build/Build/Products/Release/ProxyCat.app
          file app/ProxyCat/build/Build/Products/Release/ProxyCat.app/Contents/Resources/proxyctl

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyCat-app
          path: app/ProxyCat/build/Build/Products/Release/ProxyCat.app
          retention-days: 7

      - name: Test package orchestration
        run: |
          bash scripts/package-unsigned_test.sh
          python3 scripts/test-update-manifest.py

      - name: Build and verify DMG
        run: |
          bash scripts/package-dmg.sh
          bash scripts/test-dmg.sh dist/ProxyCat-*.dmg
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/ProxyCat/ProxyCat/Info.plist)"
          (cd helper && PROXYCAT_TEST_DMG="$GITHUB_WORKSPACE/dist/ProxyCat-$VERSION.dmg" go test ./internal/selfupdate -run '^TestInstallRealDMG$' -count=1)

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyCat-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 7
