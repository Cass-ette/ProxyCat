name: 问题报告
description: 报告 ProxyCat 的使用问题
body:
  - type: markdown
    attributes:
      value: 请勿提交订阅链接、节点密码、令牌或其他个人信息。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 简要描述实际表现和预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      placeholder: |
        1. 打开 ProxyCat
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProxyCat 版本
      description: 可在“更新日志”中查看。
      placeholder: 例如 0.14.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
  - type: dropdown
    id: mode
    attributes:
      label: 代理模式
      options:
        - 规则
        - 全局
        - 直连
        - 不确定 / 不适用
  - type: textarea
    id: details
    attributes:
      label: 补充信息（可选）
      description: 可附截图、报错或脱敏后的相关日志。
